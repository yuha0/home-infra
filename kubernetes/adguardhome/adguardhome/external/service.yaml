---

apiVersion: v1
kind: Service
metadata:
  name: http
spec:
  ports:
  - name: http
    targetPort: http
    port: 80
    protocol: TCP
  - name: metrics
    targetPort: metrics
    port: 9617
    protocol: TCP
  - name: metrics-api
    targetPort: metrics-api
    port: 9618
    protocol: TCP

---

apiVersion: v1
kind: Service
metadata:
  name: discovery
spec:
  clusterIP: None
  ports:
  - name: http
    targetPort: http
    port: 80
    protocol: TCP
