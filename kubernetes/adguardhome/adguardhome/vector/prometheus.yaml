    address: 0.0.0.0:9617
    flush_period_secs: 0
    suppress_timestamp: true
    buckets:
    - 0.0005
    - 0.001
    - 0.0025
    - 0.005
    - 0.01
    - 0.025
    - 0.05
    - 0.1
    - 0.25
    - 0.5
    - 1
    - 2.5
    - 5
    - 10

  prometheus_api:
    type: prometheus_exporter
    inputs:
    - adguardhome_api_metrics
    - vector_internal_metrics_filtered
    address: 0.0.0.0:9618
    flush_period_secs: 150
    suppress_timestamp: true
