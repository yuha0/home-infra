data_dir: /vector-data-dir
expire_metrics_secs: 3600

sources:
  adguardhome_querylog:
    type: file
    include:
    - /logs/querylog.json*
    line_delimiter: "\n"

transforms:
  parse_adguardhome_querylog_json:
    type: "remap"
    inputs:
    - adguardhome_querylog
    drop_on_abort: true
    drop_on_error: true
    reroute_dropped: false
    source: |
      . = object!(parse_json!(.message))
      .timestamp = .T
      del(.T)
      .Result.IsFiltered = .Result.IsFiltered || false
      .app = "adguardhome"
      .pod = get_env_var("POD_NAME") ?? ""
      .message = join!(compact([.QT, .QH], recursive: false), " ")

sinks:
  victorialogs:
    type: elasticsearch
    inputs:
    - parse_adguardhome_querylog_json
    endpoints:
    - http://victorialogs-victoria-logs-cluster-vlinsert.logging:9481/insert/elasticsearch/
    mode: bulk
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: app,pod
