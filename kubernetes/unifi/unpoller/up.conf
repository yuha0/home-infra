[poller]
  debug = false
  quiet = false
  plugins = []

[prometheus]
  disable = false
  http_listen = "0.0.0.0:9130"
  ssl_cert_path = ""
  ssl_key_path = ""
  report_errors = false
  dead_ports = false

[influxdb]
  disable = true


[unifi]
  dynamic = false

[unifi.defaults]
  url = "https://unifi.mgmt.yuha0.com:443"
  sites = ["all"]
  save_sites = true
  hash_pii = false
  save_ids = true
  save_events = true
  save_alarms = true
  save_anomalies = true
  save_dpi = true
  save_rogue = true
  verify_ssl = true
