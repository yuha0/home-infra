apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unpoller
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi
      app.kubernetes.io/component: unpoller
  ingress:
  - fromEndpoints:
    - matchLabels:
        prometheus: k8s
        io.kubernetes.pod.namespace: monitoring
    toPorts:
    - ports:
      - port: "9130"
        protocol: TCP
  egress:
  - toEntities:
    - host
    toPorts:
    - ports:
      - port: "53"
        protocol: UDP
      - port: "53"
        protocol: TCP
      rules:
        dns:
        - matchPattern: "*"
  - toFQDNs:
    - matchName: unifi.core.yuha0.com
    - matchName: unifi.mgmt.yuha0.com
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
