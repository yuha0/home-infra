data_dir: /vector-data-dir
expire_metrics_secs: 3600
timezone: America/Los_Angeles


enrichment_tables:
  geoip_table:
    path: /geoip/GeoLite2-City.mmdb
    type: geoip

sources:
  unifi_syslog_tcp:
    type: socket
    mode: tcp
    address: 0.0.0.0:514
  unifi_syslog_udp:
    type: socket
    mode: udp
    address: 0.0.0.0:514

sinks:
  console:
    type: console
    inputs:
    - unifi_syslog_tcp
    - unifi_syslog_udp
    encoding:
      codec: json
