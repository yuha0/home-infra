apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: vector-syslog
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-gateway-system
    sectionName: syslog-tcp
  rules:
  - backendRefs:
    - name: vector
      port: 514
---
apiVersion: gateway.networking.k8s.io/v1
kind: UDPRoute
metadata:
  name: vector-syslog
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-gateway-system
    sectionName: syslog-udp
  rules:
  - backendRefs:
    - name: vector
      port: 514
