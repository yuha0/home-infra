apiVersion: v1
kind: Service
metadata:
  name: vector
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  ports:
  - name: syslog-tcp
    port: 514
    targetPort: syslog-tcp
    protocol: TCP
  - name: syslog-udp
    port: 514
    targetPort: syslog-udp
    protocol: UDP
  type: ClusterIP
