apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
spec:
  replicas: 3
  template:
    metadata:
      labels:
        vector.dev/exclude: "true"
    spec:
      containers:
      - name: vector
        image: vector
        args:
        - --config-dir
        - /etc/vector/
        ports:
        - name: syslog-tcp
          containerPort: 514
          protocol: TCP
        - name: syslog-udp
          containerPort: 514
          protocol: UDP
        volumeMounts:
        - name: data
          mountPath: /vector-data-dir
        - name: geoip
          mountPath: /geoip
        - name: config
          mountPath: "/etc/vector/"
          readOnly: true
      terminationGracePeriodSeconds: 60
      volumes:
      - name: geoip
        persistentVolumeClaim:
          claimName: geoip
      - name: data
        emptyDir: {}
      - name: config
        projected:
          sources:
          - configMap:
              name: vector
