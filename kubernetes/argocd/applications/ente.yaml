apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ente
spec:
  destinations:
  - namespace: "ente"
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ente
spec:
  project: ente
  source:
    path: kubernetes/ente
  destination:
    namespace: ente
