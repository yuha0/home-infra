apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: unifi
spec:
  destinations:
  - namespace: "unifi"
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: unifi
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: unifi
  source:
    path: kubernetes/unifi
  destination:
    namespace: unifi
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
