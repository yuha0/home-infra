apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- pairs:
    app.kubernetes.io/part-of: vigo
namespace: vigo
resources:
- namespace.yaml
- pki.yaml
- sealed-vigo-keyring.yaml
- db
- core
- home
images:
- name: vigo-core
  newName: ghcr.io/yuha0/vigo-core
  newTag: v1.0.1
- name: vigo-home
  newName: ghcr.io/yuha0/vigo-home
  newTag: v1.0.1
