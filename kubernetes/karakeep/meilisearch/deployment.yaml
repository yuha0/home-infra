apiVersion: apps/v1
kind: Deployment
metadata:
  name: meilisearch
spec:
  strategy:
    type: Recreate
  replicas: 1
  template:
    spec:
      containers:
      - name: meilisearch
        image: meilisearch
        env:
        - name: MEILI_NO_ANALYTICS
          value: "true"
        - name: MEILI_UPGRADE_DB
          value: "true"
        volumeMounts:
        - mountPath: /meili_data
          name: meilisearch
        envFrom:
        - secretRef:
            name: meilisearch-secrets
      volumes:
      - name: meilisearch
        persistentVolumeClaim:
          claimName: meilisearch
