apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  namespace: envoy-gateway-system
spec:
  gatewayClassName: envoy-internal
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "*.internal.yuha0.com"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ""
        kind: Secret
        name: wildcard-yuha0-com
    allowedRoutes:
      namespaces:
        from: All
  - name: http
    protocol: HTTP
    port: 80
    hostname: "*.internal.yuha0.com"
    allowedRoutes:
      namespaces:
        from: All
