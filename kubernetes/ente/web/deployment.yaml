apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    spec:
      # amd64 and arm64 builds of ghcr.io/ente/web emit different
      # content-hashed asset filenames, so a mixed-arch ReplicaSet serves
      # index.html for assets that land on the wrong pod.
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: ente
                  app.kubernetes.io/component: web
              topologyKey: kubernetes.io/hostname
      containers:
      - name: web
        image: ente-web
        imagePullPolicy: IfNotPresent
        ports:
        - name: photos
          containerPort: 3000
        - name: accounts
          containerPort: 3001
        - name: albums
          containerPort: 3002
        - name: memories
          containerPort: 3010
        env:
        - name: ENTE_API_ORIGIN
          value: https://ente-api.yuha0.com
        startupProbe:
          httpGet:
            path: /
            port: photos
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /
            port: photos
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: photos
          periodSeconds: 30
          failureThreshold: 3
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsUser: 0
