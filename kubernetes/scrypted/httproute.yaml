apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: scrypted
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
    namespace: envoy-gateway-system
  hostnames:
  - scrypted.internal.yuha0.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: scrypted-tls
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: scrypted-tls
spec:
  endpoints:
  - fqdn:
      hostname: scrypted.scrypted.svc.cluster.local
      port: 10443
  tls:
    insecureSkipVerify: true
