apiVersion: v1
kind: Service
metadata:
  name: scrypted
spec:
  ports:
  - name: ui
    port: 10443
    targetPort: 10443

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: scrypted
spec:
  replicas: 1
  serviceName: scrypted
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      hostNetwork: true
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
      - name: node
        emptyDir: {}
      # Overlay a patched Node.js until scrypted ships one with the fix for CVE-2026-111497.
      initContainers:
      - name: node
        image: docker.io/library/node:22.23.4-slim
        command: ["cp", "/usr/local/bin/node", "/patched/node"]
        volumeMounts:
        - name: node
          mountPath: /patched
      containers:
      - name: scrypted
        image: scrypted
        imagePullPolicy: Always
        ports:
        - name: ui
          containerPort: 10443
        volumeMounts:
        - name: data
          mountPath: /server/volume
        - name: node
          mountPath: /usr/bin/node
          subPath: node
