# Source: victoria-logs-cluster/templates/vlstorage-server.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels: 
    app.kubernetes.io/component: vlstorage
    app.kubernetes.io/instance: victorialogs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-logs-cluster
    app.kubernetes.io/version: v1.53.0
    helm.sh/chart: victoria-logs-cluster-0.2.9
  name: victorialogs-victoria-logs-cluster-vlstorage
  namespace: logging
spec:
  serviceName: victorialogs-victoria-logs-cluster-vlstorage
  selector:
    matchLabels: 
      app: vlstorage
      app.kubernetes.io/instance: victorialogs
      app.kubernetes.io/name: victoria-logs-cluster
  replicas: 4
  podManagementPolicy: OrderedReady
  template:
    metadata:
      labels: 
        app: vlstorage
        app.kubernetes.io/component: vlstorage
        app.kubernetes.io/instance: victorialogs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-logs-cluster
    spec:
      containers:
        - name: vlstorage
          image: victoriametrics/victoria-logs:v1.53.0
          imagePullPolicy: IfNotPresent
          securityContext: 
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          args: 
            - --envflag.enable
            - --http.shutdownDelay=15s
            - --httpListenAddr=:9491
            - --loggerFormat=json
            - --retention.maxDiskUsagePercent=80
            - --retentionPeriod=31d
            - --storageDataPath=/storage
          ports:
            - name: http
              containerPort: 9491
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: vlstorage-volume
              mountPath: /storage
            
      securityContext: 
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: 
              app: vlstorage
              app.kubernetes.io/instance: victorialogs
              app.kubernetes.io/name: victoria-logs-cluster
      terminationGracePeriodSeconds: 60
  minReadySeconds: 5
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: vlstorage-volume
      spec:
        accessModes: 
          - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
        storageClassName: truenas-iscsi-general
