apiVersion: apps/v1
kind: Deployment
metadata:
  labels: 
    app.kubernetes.io/component: vlinsert
    app.kubernetes.io/instance: victorialogs
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: victoria-logs-cluster
    app.kubernetes.io/version: v1.53.0
    helm.sh/chart: victoria-logs-cluster-0.2.9
  name: victorialogs-victoria-logs-cluster-vlinsert
  namespace: logging
spec:
  selector:
    matchLabels: 
      app: vlinsert
      app.kubernetes.io/instance: victorialogs
      app.kubernetes.io/name: victoria-logs-cluster
  replicas: 2
  template:
    metadata:
      labels: 
        app: vlinsert
        app.kubernetes.io/component: vlinsert
        app.kubernetes.io/instance: victorialogs
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: victoria-logs-cluster
    spec:
      containers:
        - name: vlinsert
          image: victoriametrics/victoria-logs:v1.53.0
          imagePullPolicy: IfNotPresent
          securityContext: 
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          args: 
            - --envflag.enable
            - --http.shutdownDelay=15s
            - --httpListenAddr=:9481
            - --loggerFormat=json
            - --select.disable
            - --storageNode=victorialogs-victoria-logs-cluster-vlstorage-0.victorialogs-victoria-logs-cluster-vlstorage.logging.svc.cluster.local.:9491
            - --storageNode=victorialogs-victoria-logs-cluster-vlstorage-1.victorialogs-victoria-logs-cluster-vlstorage.logging.svc.cluster.local.:9491
            - --storageNode=victorialogs-victoria-logs-cluster-vlstorage-2.victorialogs-victoria-logs-cluster-vlstorage.logging.svc.cluster.local.:9491
            - --storageNode=victorialogs-victoria-logs-cluster-vlstorage-3.victorialogs-victoria-logs-cluster-vlstorage.logging.svc.cluster.local.:9491
          ports:
            - name: http
              containerPort: 9481
          readinessProbe: 
            failureThreshold: 3
            httpGet:
              path: /health
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe: 
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 15
            tcpSocket:
              port: http
            timeoutSeconds: 5
      securityContext: 
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: 
              app: vlinsert
              app.kubernetes.io/instance: victorialogs
              app.kubernetes.io/name: victoria-logs-cluster
      terminationGracePeriodSeconds: 30
