apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: vector

resources:
- daemonset.yaml
- rbac.yaml
- serviceaccount.yaml

configMapGenerator:
- name: vector
  files:
  - vector.yaml
  options:
    disableNameSuffixHash: true

