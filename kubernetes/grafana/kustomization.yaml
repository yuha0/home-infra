namespace: grafana
resources:
- namespace.yaml
- db
- sealed-grafana-admin.yaml
- rbac.yaml
- deployment.yaml
- service.yaml
- httproute.yaml
- dashboards
- sealed-oidc.yaml
configMapGenerator:
- files:
  - datasources.yaml
  name: grafana-provisioning-datasources
- files:
  - providers.yaml
  name: grafana-provisioning-providers
images:
- name: grafana
  newName: docker.io/grafana/grafana
  newTag: 13.2.2
- name: k8s-sidecar
  newName: docker.io/kiwigrid/k8s-sidecar
  newTag: 2.11.2
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: grafana
